name: Daily Inspiration Agent Automation

on:
  schedule:
    # Chạy tự động vào 06:00 sáng hàng ngày (giờ Việt Nam, tức 23:00 UTC)
    - cron: '0 23 * * *'
  workflow_dispatch: # Nút bấm chạy thủ công

jobs:
  run-daily-inspiration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Daily Inspiration Agent
        env:
          ORTHOGONAL_API_KEY: ${{ secrets.ORTHOGONAL_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daily_inspiration.py
